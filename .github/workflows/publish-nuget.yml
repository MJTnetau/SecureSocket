name: Publish NuGet Packages

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish to NuGet
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build & Pack
        run: dotnet pack -c Release -o ./nupkgs

      - name: NuGet Login (Trusted Publisher OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: MJTnetau

      - name: Push to NuGet
        run: dotnet nuget push "./nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.nuget-api-key }} --skip-duplicate
